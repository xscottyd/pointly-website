# GitHub Pages / Jekyll
#
# Jekyll converts every .md file it finds into a same-named .html page. The
# hand-built pages in this directory would be silently overwritten by those
# generated ones, so the legacy markdown sources and the design scratch
# directories are excluded from the published site.
#
# tester-guide.md is deliberately NOT excluded: it is the public
# /tester-guide.html page the footer links to.
exclude:
  - redesigns
  - tools
  - privacy-policy.md
  - privacy.html
  - README.md
  - vendor
